# dorai pipeline — ROS 2 nodes from one image.
#
#   voice  : mic-array capture + beamformer  -> /dorai_clean_audio
#   stt    : subscribes to clean audio       -> /dorai_transcript
#   intent : transcript -> plan (Qwen3.5-4B) -> /dorai_plan, /dorai_say, /dorai_stop
#
# Both use host networking so ROS 2 DDS discovery works between them (and with
# `ros2 topic echo` on the host) with zero extra config.
#
#   docker compose build
#   docker compose up            # voice + stt + intent
#   docker compose up stt intent # transcription + intent only (no mic needed)
#
services:
  voice:
    build: .
    image: dorai:latest
    network_mode: host
    # Share the host IPC namespace so both nodes see the SAME /dev/shm. Without
    # this, Fast DDS discovers peers over UDP but its shared-memory data
    # transport can't cross container boundaries, so topics connect yet deliver
    # zero messages.
    ipc: host
    # Expose every ALSA sound card (each USB mic enumerates as its own card).
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    environment:
      - ROS_DOMAIN_ID=0
    # 4-mic array -> raise the default cap (max_mics defaults to 3).
    # mic_name_filter pins the real array by device-name substring and excludes
    # stray inputs (e.g. an empty dock jack) that would otherwise be auto-picked
    # as a dead channel and collapse the beamformer. Set it to a substring of
    # your mics' name (here the PU425 lavaliers enumerate as "Earpods"); clear
    # it (-p mic_name_filter:="") to fall back to plain auto-detection.
    command: >
      ros2 run voice_mod voice --ros-args
      -p max_mics:=4
      -p mic_name_filter:=Earpods
    restart: unless-stopped

  # Direction of arrival. NOT started by default: it needs the raw mic-array
  # channels on ONE clock, and two processes cannot open the same ALSA capture
  # device, so `voice` and `doa` cannot both hold the array.
  #
  #   docker compose up doa          # DoA instead of voice
  #
  # To run BOTH, have voice publish its raw tap and point doa at the topic:
  #   voice:  command: ... -p publish_raw:=true
  #   doa:    command: ... -p source:=topic
  # Read the caveat on TopicSource first -- that path is only trustworthy when
  # voice_mod is driving a single multichannel device.
  #
  # device_channels/channels below describe the ReSpeaker 4-Mic Array: 6
  # channels exposed, of which ch0 is the board's own processed mix and
  # ch1..ch4 are the raw capsules. Set them to match your hardware, and set the
  # geometry to match the channel order -- see doa_mod/README.md.
  doa:
    build: .
    image: dorai:latest
    profiles: ["doa"]
    network_mode: host
    ipc: host        # shared /dev/shm — see note on the voice service
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    environment:
      - ROS_DOMAIN_ID=0
    command: >
      ros2 run doa_mod doa --ros-args
      -p source:=mic
      -p device_channels:=6
      -p vad_mode:=neural
    restart: unless-stopped

  stt:
    build: .
    image: dorai:latest
    network_mode: host
    ipc: host        # shared /dev/shm — see note on the voice service
    environment:
      - ROS_DOMAIN_ID=0
    # The default model is inside the image (stt_mod/models). Extra profiles/adapters from the host:
    volumes:
      - ${HOME}/dorai/models:/root/.cache/dorai/models:ro
    command: >
      ros2 launch stt_mod stt.launch.py
      latency_ms:=1120
      adapter:=mc-ref
      num_threads:=2
    restart: unless-stopped

  # Intent. On first start it downloads intent-qwen35-4b-Q4_0.gguf (2.6 GB) from
  # huggingface.co/sensifai/dorai-intent-model into ${HOME}/dorai/models on the host
  # (read-write mount), so later starts are offline. A GGUF already in that folder
  # is used as is. Pin another file: model:=<name | /abs/path.gguf | huggingface.co URL>.
  # Private repo: export HF_TOKEN on the host. Offline robot: auto_download:=false.
  intent:
    build: .
    image: dorai:latest
    network_mode: host
    ipc: host        # shared /dev/shm — see note on the voice service
    environment:
      - ROS_DOMAIN_ID=0
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ${HOME}/dorai/models:/root/dorai/models
    command: >
      ros2 launch intent_mod intent.launch.py
      models_dir:=/root/dorai/models
      require_wake:=true
      num_threads:=2
    restart: unless-stopped
