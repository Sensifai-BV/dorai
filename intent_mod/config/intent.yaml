# dorai intent_mod defaults. Use with:
#   ros2 run intent_mod intent --ros-args --params-file $(ros2 pkg prefix intent_mod)/share/intent_mod/config/intent.yaml
#   ros2 launch intent_mod intent.launch.py
intent_mod:
  ros__parameters:
    engine: auto            # auto (LLM if the GGUF is found, else rules) | llm (fail if missing) | rules
    model: intent-qwen35-4b-Q4_0.gguf           # Qwen3.5-4B + dorai Artaban LoRA merged, Q4_0 (2.6 GB; train/)
    lora: ""                                    # runtime adapter not needed (merged); slower on ARM
    use_grammar: false                          # 0.43 vs 0.63 s/command (VM, 4 threads), same accuracy; validate()+guard keep it safe
    grounding_guard: true                       # 'did you mean X?' when the plan names an unsaid place
    models_dir: ""          # extra models root searched first; downloads go here ("" = ~/dorai/models)
    hf_repo: sensifai/dorai-intent-model        # model missing locally -> downloaded from here at startup
    auto_download: true                         # false: never touch the network (engine auto -> rules)
    num_threads: 2
    n_ctx: 2048
    locations_file: ""      # "" = share/intent_mod/config/locations.yaml
    require_wake: true      # false: every transcript is a command (stop always works either way)
    wake_word: artaban
    wake_max_edits: 2
    status_period_s: 5.0
