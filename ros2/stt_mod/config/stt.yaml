# dorai stt_mod defaults. Use with:
#   ros2 run stt_mod stt --ros-args --params-file $(ros2 pkg prefix stt_mod)/share/stt_mod/config/stt.yaml
#   ros2 launch stt_mod stt.launch.py
stt_mod:
  ros__parameters:
    engine: whisper         # whisper (fine-tuned Whisper behind a VAD gate) | nemotron (streaming, partials)
    engine_fallback: true   # Whisper model not installed -> run nemotron instead of failing
    # --- whisper ---
    whisper_model: ""       # export directory name or its tail; "" = newest dorai fine-tune found
    language: en
    vad: neural             # neural | energy | none  (the gate that cuts the stream into utterances)
    vad_model: ""           # "" = vad_gated.onnx shipped in the package
    vad_threshold: 0.5
    vad_min_silence_s: 0.6  # silence that ends an utterance (= the wait before a transcript)
    vad_min_speech_s: 0.25  # shorter utterances are dropped
    vad_max_utt_s: 15.0
    vad_pre_roll_s: 0.3     # audio kept before the detected start, so the first word is not clipped
    max_words_per_s: 5.0    # transcripts longer than speech allows (repetition loops) are cut
    # --- nemotron ---
    latency_ms: 1120        # 80 | 160 | 560 | 1120  (1120 = only profile near real time on a Pi 4)
    adapter: mc-ref         # mc-ref | mc-das | none  (dorai fine-tuned workshop adapter)
    num_threads: 2          # Pi 4: 2 is faster than 4 (int8 kernels, no dot-product ISA)
    block_ms: 200
    ep_rule1_sil: 2.0
    ep_rule2_sil: 0.0       # 0 = auto per profile (80 ms: 0.5 s, else 0.8 s); floored at chunk + 0.2 s
    ep_max_utt: 20.0
    frame_is_utterance: false
    backlog_warn_s: 5.0
    status_period_s: 5.0
    metrics: false          # true: per-final JSON on /dorai_stt/metrics (SNR est., RTF, lag, CPU)
    metrics_file: ""        # also append metrics JSON lines here
